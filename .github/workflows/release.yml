# magicite — release workflow (spec §8: "release workflow publishes the
# image by digest and the wheel to PyPI"). Multi-arch container release,
# modeled on the sibling `atlas-aci` MCP's release.yml (same house
# hardening/attestation shape: cosign keyless signing, SBOM + provenance
# attestation, Trivy HIGH/CRITICAL gate).
#
# Triggered by a `v*` tag push (e.g. `v1.0.0`, `v1.0.0-rc.1`).
#
# Pipeline stages:
#   1. Verify pyproject.toml's version matches the tag.
#   2. Build linux/amd64 + linux/arm64 image from ./Dockerfile (the ONNX
#      model bake, `magicite fetch-model`, runs once per architecture —
#      this is the one legitimate network-touching build step, R4).
#   3. Push to ghcr.io/rynaro/magicite with SemVer tags via metadata-action.
#   4. Trivy vulnerability scan on the published image digest; GA releases
#      fail on HIGH/CRITICAL CVEs, pre-releases are exempt but SARIF is
#      still uploaded for visibility.
#   5. Cosign keyless-sign the image manifest using OIDC (no key secrets).
#   6. Generate SBOM (SPDX) and attest it.
#   7. Generate build provenance attestation.
#   8. Publish a GitHub Release with the pull-by-digest line.
#   9. Build the wheel + sdist (`uv build`) and publish to PyPI via OIDC
#      trusted publishing (no long-lived API token secret).
#
# Permissions required:
#   contents: write        — create GitHub Release
#   packages: write        — push to ghcr.io
#   id-token: write        — OIDC token for cosign signing + PyPI trusted publishing
#   attestations: write    — write attestations (SBOM + provenance)
#   security-events: write — upload SARIF to GitHub Security tab

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rynaro/magicite

jobs:
  release-image:
    name: Build, sign, attest, and publish the image
    runs-on: ubuntu-latest

    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ────────────────────────────────────────────────────────────────
      # 1. Version consistency check — the git tag is the SemVer source
      #    of truth; fail loudly if pyproject.toml's version disagrees.
      # ────────────────────────────────────────────────────────────────
      - name: Verify pyproject.toml version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          # Normalize the supported SemVer prerelease spelling to PEP 440,
          # so v0.3.0-rc.1 builds package version 0.3.0rc1 rather than a
          # misleading final-version wheel.
          PACKAGE_TAG_VERSION="${TAG_VERSION/-rc./rc}"
          PACKAGE_TAG_VERSION="${PACKAGE_TAG_VERSION/-beta./b}"

          PYPROJECT_VERSION="$(grep -E '^version = "[^"]+"' pyproject.toml \
            | head -1 | sed 's/version = "//;s/"//')"

          echo "Tag version (package):  ${PACKAGE_TAG_VERSION}"
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"

          if [ "${PACKAGE_TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo ""
            echo "ERROR: Version mismatch!"
            echo "  git tag '${TAG_VERSION}' implies package version '${PACKAGE_TAG_VERSION}'"
            echo "  but pyproject.toml declares version '${PYPROJECT_VERSION}'."
            echo ""
            echo "Fix: update pyproject.toml version to '${PACKAGE_TAG_VERSION}'"
            echo "     before pushing a release tag."
            exit 1
          fi

          echo "Version check passed: ${PACKAGE_TAG_VERSION}"

      # ────────────────────────────────────────────────────────────────
      # 2. Multi-arch build prerequisites
      # ────────────────────────────────────────────────────────────────
      - name: Set up QEMU (for linux/arm64 cross-compile)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────
      # 3. Image tags — GA (v1.2.3) -> 1.2.3, 1.2, 1, latest;
      #    pre-release (v1.2.3-rc.1) -> 1.2.3-rc.1 only.
      # ────────────────────────────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=v(\d+)\.\d+\.\d+$,group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=match,pattern=v(\d+\.\d+\.\d+-.+),group=1

      # ────────────────────────────────────────────────────────────────
      # 4. Build and push multi-arch image
      # ────────────────────────────────────────────────────────────────
      - name: Build and push multi-arch image
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Refresh runtime apt security updates on every build; preserve builder cache.
          no-cache-filters: runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture multi-arch index digest
        id: inspect
        run: |
          DIGEST="$(docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Multi-arch index digest: ${DIGEST}"

      # ────────────────────────────────────────────────────────────────
      # 5. Trivy HIGH/CRITICAL gate on the published digest
      # ────────────────────────────────────────────────────────────────
      - name: Trivy scan — generate SARIF report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Trivy scan — gate on HIGH/CRITICAL (GA releases only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # ────────────────────────────────────────────────────────────────
      # 6-7. SBOM + provenance attestation
      # ────────────────────────────────────────────────────────────────
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          artifact-name: sbom.spdx.json
          output-file: /tmp/sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: /tmp/sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # ────────────────────────────────────────────────────────────────
      # 8. Cosign keyless signing via OIDC
      # ────────────────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign (keyless OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE_NAME }}@${DIGEST}"

      # ────────────────────────────────────────────────────────────────
      # 9. GitHub Release
      # ────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Container image

            ### Pull by tag
            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```

            ### Pull by digest (recommended — immutable pin)
            ```bash
            docker pull ${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
            ```

            **Multi-arch:** `linux/amd64` + `linux/arm64`

            ### The house hardening invocation (AC-026)
            ```bash
            docker run --rm -i \
                --user "$(id -u):$(id -g)" \
                --cap-drop ALL --security-opt no-new-privileges \
                -v "$PWD":"$PWD":z -w "$PWD" \
                ${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }} \
                serve --project-root "$PWD"
            ```

            ### Supply-chain verification

            Verify the cosign keyless signature:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/Rynaro/magicite/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
            ```

            Verify SBOM + provenance attestations:
            ```bash
            gh attestation verify oci://${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }} \
              --owner Rynaro
            ```

            ### Digest for pinning
            ```
            ${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
            ```

  # ── S13 scaffold: always build/verify the wheel on tag, independent of
  # the PyPI publish gate. Uploads wheel/sdist + release-manifest to the
  # GitHub Release created by release-image. Does NOT publish to PyPI /
  # TestPyPI (that remains opt-in below). ─────────────────────────────────
  release-wheel:
    name: Build, clean-install, and attach wheel artifacts
    runs-on: ubuntu-latest
    needs: release-image
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.23"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Supply-chain immutable inputs
        run: uv run python scripts/check_supply_chain.py

      - name: Build wheel + sdist
        run: uv build

      # AC-031 against the built wheel metadata (resolved deps, not dry-run/
      # no-deps alone — scout A20). Also drop a clean-env install probe.
      - name: AC-031 — assert the built wheel does not depend on torch
        run: |
          python -m venv /tmp/magicite-wheel-meta
          /tmp/magicite-wheel-meta/bin/pip install --upgrade pip
          /tmp/magicite-wheel-meta/bin/pip install dist/magicite-*.whl
          if /tmp/magicite-wheel-meta/bin/pip list --format=json | jq -e 'map(.name | ascii_downcase) | index("torch") != null' >/dev/null; then
            echo "ERROR: torch appeared in the clean install of the built wheel" >&2
            exit 1
          fi

      - name: Clean wheel install + offline fixture probe
        env:
          MAGICITE_EMBEDDING_PROVIDER: hashing
        run: |
          wheel="$(ls -1 dist/magicite-*.whl | tail -1)"
          uv run python scripts/verify_wheel_install.py --wheel "$wheel"

      - name: Write and verify release manifest
        run: |
          uv run python scripts/check_supply_chain.py \
            --skip-immutable-inputs \
            --write-manifest dist/release-manifest.json \
            --artifacts dist
          uv run python scripts/check_supply_chain.py \
            --skip-immutable-inputs \
            --verify-manifest dist/release-manifest.json

      - name: Attach wheel artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
          fail_on_unmatched_files: true

      # Exact bytes for release-pypi — never rebuild; publish must match the
      # digest-attested release-manifest attached above.
      - name: Upload dist for release-pypi handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magicite-release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 5

      # Published-channels milestone hook (UNEVALUATED until after S11/S15):
      # verify fetched image/wheel digests + signatures against the attached
      # release-manifest.json (cosign / gh attestation / pip download --no-deps
      # hash check). Do not enable here without release authority.

  release-pypi:
    name: Publish the attested wheel to PyPI
    runs-on: ubuntu-latest
    needs: [release-image, release-wheel]
    # Opt-in. OIDC trusted publishing requires a *pending publisher* registered
    # on PyPI for this exact repo/workflow/environment BEFORE the first tag, and
    # there is no token fallback — so without that setup this job fails every
    # release rather than doing nothing. The container is the primary artifact
    # (see README); flip the repo variable PUBLISH_TO_PYPI=true once the pending
    # publisher exists. A skipped job here never blocks the already-published,
    # signed, attested image, because release-image does not depend on it.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    # Pre-releases (-rc./-beta.) publish to TestPyPI only; GA tags publish
    # to the real index. Both use OIDC trusted publishing (no API token).
    environment:
      name: pypi
      url: https://pypi.org/project/magicite/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download attested release dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: magicite-release-dist
          path: dist

      - name: Verify downloaded artifacts match release manifest
        run: |
          python3 scripts/check_supply_chain.py \
            --skip-immutable-inputs \
            --verify-manifest dist/release-manifest.json

      # Re-assert AC-031 against the *same* bytes release-wheel attested —
      # no second `uv build`.
      - name: AC-031 — assert the published wheel does not depend on torch
        run: |
          python -m venv /tmp/magicite-pypi-meta
          /tmp/magicite-pypi-meta/bin/pip install --upgrade pip
          /tmp/magicite-pypi-meta/bin/pip install dist/magicite-*.whl
          if /tmp/magicite-pypi-meta/bin/pip list --format=json | jq -e 'map(.name | ascii_downcase) | index("torch") != null' >/dev/null; then
            echo "ERROR: torch appeared in the clean install of the attested wheel" >&2
            exit 1
          fi

      - name: Publish to PyPI (OIDC trusted publishing)
        if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Publish to TestPyPI (pre-releases)
        if: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
