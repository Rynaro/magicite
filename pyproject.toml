[project]
name = "magicite"
version = "0.1.0"
description = "Local-first plasticity-inspired skill router speaking MCP over stdio."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "click>=8.1",
  "structlog>=24.1",
  "fastembed>=0.4",
]

[project.optional-dependencies]
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5"]

[project.scripts]
magicite = "magicite.__main__:cli"
magicite-bench = "magicite.eval.bench:main"

[tool.uv]
# Transitive-CVE floor, copied from the sibling `atlas-aci` MCP's
# pyproject.toml (spec §8: "the [tool.uv] constraint-dependencies floor
# list copied from atlas-aci"). These four packages arrive transitively
# via `mcp>=2.0` (pyjwt[crypto] -> cryptography, python-multipart,
# starlette) rather than as direct Magicite dependencies; `uv.lock` already
# resolves at/above every floor below as of mcp==2.0.0 -- this block is a
# forward-looking guard against a future downgrade re-introducing a known
# CVE, not a change to what is currently installed.
constraint-dependencies = [
  "cryptography>=48.0.1",     # GHSA-537c-gmf6-5ccf — vulnerable OpenSSL in wheels
  "pyjwt>=2.13.0",            # CVE-2026-48526 — auth bypass via forged tokens
  "python-multipart>=0.0.30", # CVE-2026-42561, CVE-2026-53539 — parser DoS
  "starlette>=1.3.1",         # CVE-2026-48818 (SSRF/NTLM), CVE-2026-54283
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magicite"]
# M7 fix: hatchling's default wheel builder already recurses through every
# non-excluded file under `packages` (so engram/schema/engram-0.2.schema.json
# and storage/migrations/*.sql ship automatically) -- a prior `force-include`
# table here duplicated both paths and made `uv build --wheel` fail outright
# ("A second file is being added to the wheel archive at the same path"),
# undiscovered until M7 was the first milestone to actually run a wheel
# build (M0-M6 only ever exercised `uv sync`/editable installs). Verified
# below (M7): both files are present in the built wheel without any
# `force-include`/`artifacts` entry.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "acceptance: acceptance-level tests mapped to a frozen AC id",
  "benchmark: wall-clock performance assertions -- hardware-sensitive, excluded from the blocking CI gate (see tests/integration/test_route_latency.py docstring), run separately and non-blocking for visibility",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Vivi implements against Python 3.12 in CI (spec Assumption A4); the package
# floor stays requires-python = ">=3.11" and CI matrices both versions.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
