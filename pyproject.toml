[project]
name = "magicite"
version = "0.1.0"
description = "Local-first plasticity-inspired skill router speaking MCP over stdio."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "click>=8.1",
  "structlog>=24.1",
  "fastembed>=0.4",
]

[project.optional-dependencies]
leiden = ["python-igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5"]

[project.scripts]
magicite = "magicite.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magicite"]

[tool.hatch.build.targets.wheel.force-include]
"src/magicite/engram/schema/engram-0.2.schema.json" = "magicite/engram/schema/engram-0.2.schema.json"
"src/magicite/storage/migrations" = "magicite/storage/migrations"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "acceptance: acceptance-level tests mapped to a frozen AC id",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Vivi implements against Python 3.12 in CI (spec Assumption A4); the package
# floor stays requires-python = ">=3.11" and CI matrices both versions.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
