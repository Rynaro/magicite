# ── Claim scope (AC-D7) ────────────────────────────────────────────────────
claim_scope:
  demonstrated: >-
    The 16-tool surface, portable format, rebuildable index, trust gate,
    approval-gated lifecycle, and Tier-2 boundary all work end-to-end against a
    real registry over the same protocol an external host uses.
