# ── Problem ────────────────────────────────────────────────────────────────
problem: >-
  Magicite ships a 16-tool MCP skill router, a portable .egr.md format, a
  rebuildable index, a Dream consolidation worker, lifecycle governance, and a
  documented Tier-2 hook adapter -- and consumes none of it. The repository had
  zero first-party engrams (only 7 Proton/Steam test fixtures), was absent from
  its own .mcp.json, and wired none of its own documented hooks.

# ── Tradeoff of record (required at tier=full) ─────────────────────────────
tradeoff:
  question: >-
    Does this project's own .mcp.json run the pinned published container digest
    or the local working tree?
  options:
    - id: container
      pro: "reproducible; identical to what external users run"
      con: "frozen at v0.1.0, so a regression in src/ is invisible to the loop"
    - id: local
      pro: "routes through the code under development; defects surface immediately"
      con: "not the artifact users run; depends on a synced .venv"
  decision: local
  rationale: >-
    Dogfooding exists to make us feel our own defects, and only the local
    binding does that. The container path loses no coverage by this choice --
    tests/acceptance/test_docker_smoke.py already exercises it mechanically,
    including a --network none handshake and register/route cycle.

