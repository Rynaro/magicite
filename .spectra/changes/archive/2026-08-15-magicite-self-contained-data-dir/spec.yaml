# ── Problem ────────────────────────────────────────────────────────────────
problem: >-
  Magicite wrote all of its state into `.spectra/`, a directory owned by
  ESL/tonberry (which owns `.spectra/changes/`). The two tenants collided
  confusingly -- Magicite's `.spectra/archive/` (decayed engrams) sat one level
  from ESL's `.spectra/changes/archive/` (archived change records) -- and a
  standalone Magicite user got a directory named after a tool they may never
  have heard of. The ecosystem convention is one dot-directory per tool
  (`.atlas/`, `.eidolons/`).

# ── Amendment record ───────────────────────────────────────────────────────
amendment:
  tag: DATA-DIR-AMENDED
  date: "2026-08-15"
  supersedes: "spec §1 data layout (.spectra/)"
  new_location: ".magicite/"
  scope: "path resolution only"
  unchanged: >-
    The 16-tool MCP surface, routing, plasticity, the trust gate. No decision
    the router or the Dream worker makes is affected, and no claim in docs/01's
    Falsification Record is touched.

# ── Tradeoff of record ─────────────────────────────────────────────────────
tradeoff:
  question: "Clean break on the old layout, or resolve both?"
  decision: "read both, with a loud deprecation"
  rejected:
    option: "clean break"
    why_rejected: >-
      An absent registry directory is a legal state for a fresh project, so a
      clean break would not error on a legacy project -- it would come up with
      an EMPTY registry and route against zero skills. Silent zero-skill
      routing is the worst failure mode a router has.
  cost_accepted: >-
    One extra branch in path resolution, bounded to a single documented
    function, droppable at the next minor version.
  safety_property: >-
    The fallback requires `.spectra/engrams/` to actually exist. `.spectra/changes/`
    is ESL's and proves nothing about Magicite, so every ESL-using project in
    this ecosystem still resolves to `.magicite/`.

