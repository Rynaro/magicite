# ── Problem ────────────────────────────────────────────────────────────────
problem: >-
  The 16 engrams authored by magicite-dogfoods-itself are all operational --
  how to run, govern, release and reason about Magicite. None describe the code
  an agent must actually change, so the registry could not help with the work
  the repository mostly consists of.

# ── Tradeoff of record ─────────────────────────────────────────────────────
tradeoff:
  question: "One registry for both operational and codebase engrams, or two?"
  decision: one
  rationale: >-
    Magicite exposes one registry path per project root, so two sets would need
    two servers and two indexes -- pushing the routing decision back into the
    host layer Magicite exists to replace. One registry keeps a single route()
    call authoritative.
  measured_cost:
    rank1_before: "3/4 at 16 engrams"
    rank1_after: "2/4 at 30 engrams"
    top3_before: "4/4"
    top3_after: "4/4"
    note: >-
      Enlarging the registry with adjacent material cost top-1 precision. Four
      queries, single-author corpus, no held-out set -- the direction is worth
      knowing, the magnitude is not.
  mitigations_attempted:
    - lever: "negative triggers / intent.not_when"
      result: inert
      why: >-
        embeddable_text excludes both, and core/router.py never reads
        engram_trigger. Zero effect on ranking.
    - lever: "declared inhibits edge (symmetric pair)"
      result: backfired
      why: >-
        Inhibition scales the target's activation by the source's, so between
        two co-activated nodes the leader suppresses the follower harder.
        Pushed the intended engram out of the top 3 (4/4 -> 3/4). Reverted.
  conclusion: >-
    No authoring-side mitigation for this precision cost is currently known to
    work. Making negative triggers reach retrieval, or making inhibition
    asymmetric, are routing changes requiring measurement under the project's
    own amendment protocol; neither attempted here.

