    risk: "Newly-live declared-edge mass is itself unmeasured. Section 3.3.1 puts declared composes/depends_on into the activation graph and makes inhibition arithmetically real for the first time - 11 declared inhibits relations in the 70-engram benchmark registry that have NEVER had any effect now scale their targets' activation by 0.3. ppr_restart=0.85 was measured on the OLD graph, so its 0.5476 Hit@1 does not transfer unchanged; community structure re-clusters once _COMMUNITY_WEIGHT_FLOOR is deleted; and baseline (c)'s published numbers move. Shipping on an obsolete measurement is exactly the failure this amendment exists to correct. [FIRED 2026-08-15, errata R12-FIRED - the mitigation worked as designed: the release obligation forced the re-measurement BEFORE release. Outcome, published in spec.md section 3.3.1 at commit 2d25abb: ppr_restart=0.85 is CONFIRMED on the new graph shape (it is what recovers (c) 0.4333 -> 0.5286 and (d) 0.4905 -> 0.5476), so that clause is CLOSED. declared_edge_strength=1.0 measured -0.0286 Hit@1 in (d) - 115 -> 109 of 210, six queries, no paired test run, ceiling p=0.031 - and STAYS AT 1.0, because baseline (c) carries the same declared mass into the diffusion graph without inhibition or the community rerank and is IDENTICAL across both arms (0.5286, 111/210): the diffusion channel measured EXACTLY INERT, so the -6 arises in a channel the run never isolated. WHAT REMAINS UNMEASURED IS THEREFORE NARROWER: the INHIBITION MAGNITUDE - inhib_gain=0.7 predates the amendment, was set for a LEARNED S over [0,1], and now cuts 70% of an inhibited node's activation from one line of author YAML at S=1.0 - and the COMMUNITY RE-CLUSTERING. MO-3 is still owed. || RC-1 FIRED AND WAS DISCHARGED, BOTH HALVES, 2026-08-15, errata INHIB-GAIN-RECALIBRATED. RC-1b: baseline (c) DOES respond to declared_edge_strength (it moves at 5.0), so its 0.0-vs-1.0 invariance is a REAL PROPERTY OF THE CORPUS, not a harness artefact - declared_edge_strength = 1.0 STANDS CONFIRMED. RC-1a: INHIBITION IS THE CHANNEL - inhib_gain=0.0 gives (d) 0.5429 against 0.5190 at 0.7, 84% of the gap, residual one query. MO-3 IS THEREFORE DISCHARGED. inhib_gain moves 0.7 -> 0.245, DERIVED as theta_synapse * inhib_gain and NOT selected from the sweep: 0.7 is PARETO-DOMINATED BY FOUR OF FIVE alternatives on Hit@1, Hit@3 and MRR simultaneously and NEVER HAD ANY EVIDENCE FOR IT IN ANY REGIME, the inhibition pass having been a numeric no-op until this amendment. inhib_gain=0.0, the corpus's own Hit@1 argmax, is FORBIDDEN: it makes AC-023 and AC-034 unprovable. WHAT REMAINS OPEN IN R12 IS NOW ONLY SINGLE-CORPUS GENERALISATION, owned by RC-2/RC-3/RC-5.]"
    mitigation: "FIVE PRE-REGISTERED REVERSAL CONDITIONS WITH DECISION RULES ATTACHED (spec.md sections 3.3.1 and 3.3.2, RC-1...RC-5), applied without a further judgement call. RC-1 is DISCHARGED; RC-5 is new and pre-registers the Hit@1/Hit@3 divergence with HIT@1 NAMED AS THE METRIC OF RECORD, so the metric cannot be chosen after the fact. RC-1 (DISCHARGED 2026-08-15): isolate inhibition (inhib_gain 0.7 vs 0.0 at declared_edge_strength=1.0) - if it accounts for the whole -0.0286 the defect is the inhibition magnitude, not the authored channel; if none of it, call-site row 3's community re-clustering is what gets revisited. RC-2: a SECOND, INDEPENDENTLY-AUTHORED corpus plus a PAIRED McNEMAR test - at p < 0.05 against, declared_edge_strength ships at 0.0 (mechanism implemented, verified, opt-in) and AC-035 is restated. RC-3 (= CF-7): a compositional query set - H-COMPOSE is still UNTESTED - and a null there retires the diffusion claim regardless of RC-1. RC-4: a known-good declared-relation registry, to remove the single-author confound. The change remains ONE CONFIG SCALAR AND EXACTLY REVERTIBLE - declared_edge_strength=0.0 reproduces pre-amendment scores bit-for-bit (AC-039, whose proving unit pins 0.0 explicitly and is therefore satisfiable at ANY shipped default) - so every reversal is a config line, not a code change. RECORDED AGAINST 0.0 AS A SHIPPED DEFAULT: it makes AC-023 unreachable in production again, makes AC-035's THEN FALSE AS WRITTEN (raw weight 0.0, build_graph drops w<=0, and the proving unit's 'assert raw_weight > 0' fails at the default - so it needs an AC-035 restatement plus a tests/ change), and drops declared edges from community structure entirely, which is WORSE than pre-amendment now that _COMMUNITY_WEIGHT_FLOOR is deleted. NOT sufficient as evidence: more queries on the SAME corpus - the confound is not statistical."

# ── corpus contradictions resolved unilaterally (spec section 9) ───────────
corpus_contradictions:
  - id: CR-1
    confidence: high
    tension: "route() updates exposure_count (docs/05) vs Tier-A file fields being Dream-only (docs/02-04)"
    resolution: "bookkeeping counters are Tier-C accumulators (eph_bookkeeping); the file value is last-checkpoint + delta, folded in at Dream phase 7"
  - id: CR-2
    confidence: high
    tension: "skill-graph.db 'can be committed' (docs/06) vs the DB being a rebuildable cache (docs/03,04)"
    resolution: "path stays per docs/02; register() writes a .gitignore excluding skill-graph.db*; MAGICITE_COMMIT_DB=1 restores the docs/06 reading"
  - id: CR-3
    confidence: high
    tension: "Dream drafts composites 'via local model' (docs/03) and the LLM rubric (docs/07) vs local-first no-service posture (docs/02)"
    resolution: "the v1 server ships no generative model: nucleate emits proposals (trace IR + skeleton), the host agent drafts and calls register(); the rubric gate is a deterministic 12-point structural rubric at the docs/07 >=8/12 bar; rubric_provider=host reserved"
  - id: CR-4
    confidence: high
    tension: "register()'s 'any lint violation -> hard error' vs GAP-005 wholesale SKILL.md migration"
    resolution: "two lint profiles: strict keeps the hard error; import downgrades to warnings and lands status=draft + verification_status=pending, never routable, never silently accepted"
  - id: CR-5
    confidence: high
    tension: "the 16-tool surface (brief, docs/05's 8+8 arithmetic) vs 13 tools actually headed in docs/05"
    resolution: "v1 ships exactly 16 = 14 unified inventory + load_skill_body (docs/05 progressive disclosure) + session_end (docs/03 session-end trace, the on-session-end Dream trigger); 8+8 is pre-deduplication"
  - id: CR-6
    confidence: high
    tension: "Ollama named in docs/02 vs 'local embedding model' plus an offline hardened container"
    resolution: "Embedder protocol with fastembed (default, baked), ollama (opt-in, preserves the docs/02 reading), hashing (deterministic, CI); embedding.model records the producer so docs/04's bge-m3 example stays legal"
  - id: CR-7
    confidence: high
    tension: "docs/06 says imports start status=pending vs docs/04's status=nascent + verification_status=pending"
    resolution: "the two axes stay orthogonal; pending is never a lifecycle status; imports are status in {nascent, draft} x verification_status=pending"
  - id: CR-8
    confidence: high
    tension: "docs/04 defines id as the content-hash of identity+routing while version bumps on every sharpening \u2014 sharpening would change every id and dangle every edge FK"
    resolution: "id is computed once at first registration and is thereafter immutable; the identity+routing hash lives separately as identity_sha256 for drift and duplicate-import detection (found by the critic pass)"

