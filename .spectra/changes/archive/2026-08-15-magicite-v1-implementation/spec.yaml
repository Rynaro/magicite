  - id: DECLARED-EDGES-AMENDED
    at: "2026-08-15"
    record: .spectra/changes/magicite-v1-implementation/decisions/DECLARED-EDGES-AMENDED.md
    disposition: "FORMAL SPEC AMENDMENT - a design gap no code patch can legitimately close (spec.md:593 asked for a value that is unsatisfiable as written), plus two evidence-driven default changes. New criteria in a marked addendum; the frozen criteria file is byte-identical and was NOT re-frozen. No re-plan, no re-scoring, no phase re-walk. UNLIKE the two errata above, this one DOES change executable behaviour."
    authorizing_verdict: "FORGE (Reasoner) - adjudicating the partial falsification of H-BODY, 2026-08-15, composite ROOT-CAUSE + TRADE-OFF + CONSTRAINT-SATISFACTION, standard depth, requires_checker true. Section 4 [VERDICT] 'Damp, don't amputate' (Tier-1 items 1-3); section 5 remedy (a) amend the spec to state where a declared edge's S_edge comes from, (b) write a NEW AC whose GIVEN names the ingestion path, (c) do it WITHOUT editing frozen AC-023."
    trigger: >-
      Confirmed BY EXECUTION (ATLAS): author-declared edges (needs->depends_on, composes, inhibits)
      carry EXACTLY ZERO activation mass, permanently, and no code path can ever raise them.
      route() at spec defaults and route() with every declared type_gain AND inhib_gain zeroed
      return BIT-IDENTICAL scores to 12 decimal places; forcing a declared S_edge=0.9 DOES change
      the ranking, so the path is live and simply never fed. storage/durable.py:203 inserts
      declared edges at storage_strength=0.0 and the ON CONFLICT clause updates only
      dst_id/dangling; core/dream.py:194 + core/signals.py:152-164 restrict potentiation to
      co_activation, the only type ever tagged; core/activation.py:56 then DROPS edges with w<=0,
      so declared edges are ABSENT from the graph rather than weak. Consequences that make this a
      spec problem: plan_confidence (spec.md:593 section 3.3 step 10) is permanently 0.0 for every
      multi-node plan and is client-visible; apply_inhibition is a numeric no-op, so AC-023 is
      unreachable in production (it passes only because tests/unit/core/test_router.py:80 injects
      storage_strength=0.8 by direct SQL); and declared composes/depends_on are silently removed
      from routing.
    ruling: >-
      FORGE's position ADOPTED on substance (declared mutual exclusion and composition are AUTHORED
      ASSERTIONS, not earned Hebbian weights) and SHARPENED on mechanism. (1) The category error was
      the CONFLATION of two semantics in one column, not the 'earned' principle itself: S_eff =
      max(edge.storage_strength, w_authored(edge)) keeps 'weight is earned, not assumed'
      (storage/durable.py:304-309) true of storage_strength, which is the channel it was always
      about. (2) A FLOOR, not FORGE's 'fixed gain independent of S_edge' - learning may exceed an
      assertion, it may not erase one, and S_eff stays in [0,1] so 1 - S*inhib_gain stays positive.
      (3) Scope is all authored types, not just inhibits. FORGE's arithmetic objection to a floor is
      ANSWERED, not accepted: it targets the magnitude 0.1 (~2.7% of graph mass), not the form; at
      the authored magnitude 1.0 the same arithmetic gives ~21.7% of global mass and, since W is
      row-normalised, ~36-53% of a declared node's own outflow. WITHHELD: the hub-penalty structural
      PageRank keeps type_gain-only weighting - it is the one graph mechanism measured to help
      (+0.0286 Hit@1) and re-weighting it is FORGE's own open D3 experiment.
    what_changed: >-
      New normative spec.md section 3.3.1 'Effective edge weight': S_eff = max(storage_strength,
      w_authored), w_authored = declared_edge_strength (new magicite.toml knob, default 1.0) for
      provenance='declared' and 0.0 for learned/derived/distilled. Computed at READ, never stored -
      no column, no second migration, no checkpoint field - so AC-009/AC-010 are untouched (pinned
      by AC-036) and Dream's decay/prune/renormalise still operate on the learned column alone.
      Exactly revertible at declared_edge_strength=0.0 (AC-039). One pure helper
      core/edge_weight.py::effective_strength, guarded by an AST criterion (AC-040). Amended sites:
      section 3.3 step 4 (W_ij = S_eff * type_gain), step 5 (a_i *= 1 - S_eff*inhib_gain, S_eff
      DIRECTLY since type_gain['inhibits']=0.0 by design), step 9 (cycle-break becomes the total
      order (S_eff, dep_name, dependent_name)), step 10 (plan_confidence redefined structurally),
      section 2.6 step 9 (community weights use S_eff; _COMMUNITY_WEIGHT_FLOOR deleted), introspect
      edge rows (additive effective_strength field), eval/bench.py baseline (c) (same helper with
      the learned channel suppressed). Defaults: ppr_restart 0.15 -> 0.85 (MEASURED) and
      w_retrieval 0.15 -> 0.05 with w_similarity 0.30 -> 0.40 (PRECAUTIONARY pending experiment).
      Risks: R10 annotated as FIRED with its measured outcomes; new R12 for the newly-live,
      unmeasured declared-edge mass.
    plan_confidence_fix: >-
      Section 3.3 step 10 WAS mean(S_edge over plan edges) * (resolved_deps/declared_deps), which
      was unsatisfiable: plan edge types are depends_on/composes, always provenance='declared', and
      Dream potentiates only co_activation, so mean(S_edge) was a STRUCTURAL constant. It is now
      |E_sat|/|E| (1.0 when |E|==0) over the emitted plan's declared depends_on/composes edges,
      where E_sat are those that resolve, whose target appears in `order`, and whose ordering
      `order` respects. The S_edge factor is REMOVED rather than floated to 1.0 - a factor that can
      only ever be a constant carries no information in either regime. Dangling targets, depth/size
      truncation and cycle-breaking all fall out of one rule with no extra constants. Deliberate
      behaviour change: the len(order)<=1 -> 1.0 short-circuit is gone, so a lone winner with two
      unresolvable needs now honestly reports 0.0. Pinned by AC-037/AC-038.
    defaults_changed:
      - "ppr_restart 0.15 -> 0.85 (MEASURED, 70 engrams / 210 pre-registered queries, one Config field at a time): Hit@1 0.4619 -> 0.5476 (== embedding baseline (b)), Hit@3 0.7000 -> 0.7476 (> (b)'s 0.7429), MRR 0.5913 -> 0.6398. At 0.15, 85% of activation mass diffused along the 350 derived similar_to kNN edges. NOT w_activation=0 despite its 0.0048 better Hit@1: inhibition acts ONLY on the activation vector, so zeroing that weight makes AC-023 arithmetically UNPROVABLE - breaking a frozen criterion to buy one query in 210 - and turns 45% of the score into a constant zero, taking the hub penalty and community rerank with it."
      - "w_retrieval 0.15 -> 0.05 and w_similarity 0.30 -> 0.40, PRECAUTIONARY PENDING FURTHER EXPERIMENT, explicitly not a measured optimum. Evidence-balance asymmetry, not a new magic number: 0.15 has one strong measurement against it (oracle teacher, MATCHED train/test distributions: held-out Hit@1 0.4697 -> 0.1061; train split 0.4583 -> 0.2847; target-only variant still 0.1818; w_retrieval*R spread = 63% of the query-conditioned signal's amplitude) and zero measurements ever for it. Honest limit carried: the workload is uniform, which makes a popularity prior maximally uninformative. w_activation and w_excitability unchanged; the four still sum to 1.00."
    new_criteria: "AC-034 ... AC-042 in acceptance-criteria-addendum.md (9 criteria, ramza-ears-lint 9/9 pass). AC-034's GIVEN names the register() ingestion path, so it exercises a state production can actually reach. NOT frozen and NOT merged into acceptance-criteria.md: ramza-freeze writes plan-state.json criteria_sha256, which must keep naming the frozen 33."
    ac_023: "PROVENANCE-UNDERSPECIFIED IN ITS GIVEN, and deliberately NOT edited. It says nothing about provenance, so tests/unit/core/test_router.py:80 (direct-SQL storage_strength=0.8) proves it exactly as written - a coverage defect in the frozen criteria, not a checker failure and not a test-fidelity failure. Remedy is AC-034, not a rewrite: editing a frozen criterion to repair its own weakness would destroy the tamper-evidence anchor (R11)."
    spec_md_sha256: {prev: 57148a2de70fa723b65cddbce2b57de98327a7ba44b272415101a9263aa79c17, new: e9efab604467129246e0b70fb25ed70a576bc4fee5934a243881e2151101dd8b}
    spec_md_locations: "reading-contract errata banner; section 2.2 edge DDL comment; section 2.6 step 4 note; section 3.3 route steps 4/5/6/9/10 (superseded values struck in-comment, never deleted); NEW section 3.3.1 Effective edge weight (incl. the routing-defaults table and the release obligation); section 3.3 introspect note; section 4.3 Dream note; Acceptance Criteria pointer + the AC-034...AC-042 addendum block + the AC-023 coverage note; section Risks R10 (fired) and new R12; Handoff."
    envelope_integrity_restamped: true
    unchanged: "acceptance_criteria.sha256 (7bd3d184..., byte-identical, NOT re-frozen; amendments[] still empty; AC-023 not edited); AC-001...AC-033 text; validation_gates (all nine); invariants; tool_surface (introspect gains one ADDITIVE output field - no tool added, removed, renamed or re-signatured); milestones; corpus_contradictions; wire_declared_edges, the DDL and the single migration; Dream's phases and theta_* constants; the hub-penalty PageRank; w_activation/w_excitability/type_gain/inhib_gain/hub_penalty; every ramza.scores value"
    measurement_obligations: "MO-1 re-run the cold 210-query bench after implementation and PUBLISH the new (b)/(c)/(d) numbers (ppr_restart=0.85 was measured on a graph in which declared edges were still inert); MO-2 baseline (c)'s published numbers move and must be re-published or marked superseded; MO-3 report the inhibition delta SEPARATELY - 11 declared inhibits relations that never had any effect now scale their targets' activation by 0.3"
    carry_forward: "CF-1 FORGE section 6's docs/01 + docs/07 corrections are routed to IDG (docs/ is outside RAMZA's write boundary); CF-2 synapses: has no reader, so learned edge weights do NOT survive a DB rebuild and the next checkpoint erases the file's own record - a separate spec-conformance defect against section 2.6 step 4, NOT fixed here; CF-3 the earnable-declared-edge path stays open (the floor form accommodates it with no further spec change); CF-4 FORGE's D1/D2/D3; CF-5 the uncalibrated combination rule (four raw, un-normalised, differently-scaled terms at fixed weights); CF-6 R1-RESTATED's own CF-4/CF-5 remain open"
    verified_status_impact: "The change was already escalated from verified to in_progress by a drift check before this record. UNLIKE the two prior errata this amendment DOES change executable behaviour, so every VG must be re-run after implementation and AC-034...AC-042 attested alongside AC-001...AC-033. AC-009/AC-010 are specifically protected by the read-time (never persisted) design and pinned by AC-036; AC-023 still passes."
    human_confirmation: "recommended before release on two points: declared_edge_strength=1.0 makes authored structure route for the first time and its scale effect is unmeasured (R12; one revertible config scalar), and w_retrieval 0.15 -> 0.05 is explicitly precautionary pending D1/D2. Neither blocks implementation."
  - id: R12-FIRED
    at: "2026-08-15"
    record: .spectra/changes/magicite-v1-implementation/decisions/R12-FIRED.md
    disposition: "MEASUREMENT RECORD + DEFAULT CONFIRMED, NOT CHANGED. R12's release obligation fired and is discharged for MO-1/MO-2; declared_edge_strength stays at 1.0; ppr_restart=0.85 is CONFIRMED on the new graph shape. No rule change, no default change, no acceptance-criteria change, no config change implied, no re-plan, no re-scoring, no phase re-walk. DECLARED-EDGES-AMENDED is NOT superseded - only its ppr_restart-row figures and baseline (c)'s published numbers are, and that record itself obliged their re-measurement."
    authorizing_trigger: "Self-imposed: the release obligation written into DECLARED-EDGES-AMENDED section 8 (MO-1/MO-2/MO-3) and spec.md section 3.3.1. ppr_restart=0.85 had been measured on the OLD kNN-only graph in which declared edges carried zero mass, and the amendment changed that graph underneath it. No new external verdict was required."
    trigger: >-
      The cold 210-query bench was re-run at implementing commit 2d25abb - 70 engrams, 210
      lexically-independent pre-registered queries, cold registry, real fastembed
      BAAI/bge-small-en-v1.5, the same corpus and queries as the original falsification run, nothing
      re-authored. Hit@1: amended defaults (declared_edge_strength=1.0, ppr_restart=0.85) a 0.4048,
      b 0.5476, c 0.5286, d 0.5190; declared edges OFF (declared_edge_strength=0.0,
      ppr_restart=0.85) a 0.4048, b 0.5476, c 0.5286, d 0.5476; both reverted
      (declared_edge_strength=0.0, ppr_restart=0.15) a 0.4048, b 0.5476, c 0.4333, d 0.4905.
      Pre-amendment reference (old weights too): a 0.4048, b 0.5476, c 0.4571, d 0.4619. All figures
      are integer-consistent at n=210 (0.4048=85, 0.5476=115, 0.5286=111, 0.5190=109, 0.4905=103,
      0.4333=91).
    ruling: >-
      (1) ppr_restart = 0.85 is CONFIRMED on the new graph shape - holding declared_edge_strength=0.0
      and moving only the restart, (c) goes 0.4333 -> 0.5286 and (d) goes 0.4905 -> 0.5476. R12's
      stated worry, that 0.5476 was an artefact of the old kNN-only graph and would not transfer,
      does NOT materialise; that clause of R12 is CLOSED. (2) declared_edge_strength SHIPS AT 1.0,
      confirmed on the evidence rather than merely retained. The re-measurement contains an
      ACCIDENTAL ISOLATION that was not read out and is decisive: baseline (c) carries declared
      composes/depends_on into the diffusion graph at FULL authored mass (eval/bench.py:198-208,
      _GRAPH_EDGE_TYPES weighted by effective_strength_no_learned(..., cfg.declared_edge_strength) *
      type_gain) and carries NO inhibition (inhibits is not in _GRAPH_EDGE_TYPES and
      _baseline_c_rank never calls apply_inhibition), NO community rerank, NO hub penalty, NO R, NO
      excitability - and (c) is 0.5286 in BOTH arms, 111 of 210, IDENTICAL. Putting full declared-edge
      mass into the activation graph changed ZERO of 210 top-1 answers. The -6 in (d) therefore
      cannot be attributed to call-site rows 1 or 3 and must arise in a channel present in (d) and
      absent from (c): INHIBITION (row 2) or the COMMUNITY RE-CLUSTERING (row 3). The run separated
      neither - which is exactly what MO-3 was written to obtain. Lowering declared_edge_strength
      would damp a channel measured INERT in order to treat a channel NEVER ISOLATED.
    symmetry_with_w_retrieval_answered: >-
      The challenge is fair and is answered rather than waved off: w_retrieval moved 0.15 -> 0.05 on
      an evidence-balance asymmetry, and declared_edge_strength=1.0 now has one weak measurement
      against it and none for it. But the principle as DECLARED-EDGES-AMENDED section 7.2 actually
      states it has THREE qualifiers - "the downside it guards against is catastrophic; the upside it
      forfeits is unmeasured; the change is one config line" - and this case fails all three.
      EFFECT SIZE: w_retrieval was a 3.6x collapse (held-out Hit@1 0.4697 -> 0.1061, failing on its
      own training split too at 0.4583 -> 0.2847); this is 6 queries in 210, still far above lexical
      0.4048 and above the as-shipped 0.4619. MECHANISM: w_retrieval's was measured (63% of the
      query-conditioned signal's amplitude from a zero-query-conditioned prior); this one is NOT
      identified - the channel in question measured exactly inert. WHAT REVERSAL FORFEITS:
      w_retrieval at 0.05 forfeits nothing structural; declared_edge_strength at 0.0 forfeits three
      shipped behaviours and one addendum criterion. STATISTICAL STANDING: a net swing of 6 in 210
      has a MAXIMUM ATTAINABLE exact-binomial (McNemar) significance of p = 2*0.5^6 = 0.031, and only
      if all six discordant pairs run one way; with four discordances the other way (n=14) it is
      p = 0.180. The b-d gap this spec previously acted on was 18 queries at p = 0.00053. A 3.6x
      collapse justified a precautionary default change; a six-query delta justifies a published
      measurement, a narrowed risk and a pre-registered reversal condition - not a default change.
    uncalibrated_interaction_found: >-
      inhib_gain = 0.7 PREDATES this amendment (section 11 of DECLARED-EDGES-AMENDED lists it as
      deliberately unchanged) and was set when an inhibits edge's S was expected to be a LEARNED value
      distributed over [0,1]. Call-site row 2 pins S to the TOP of that range for EVERY authored
      inhibits edge and, uniquely among the call sites, uses S_eff directly without type_gain (because
      type_gain['inhibits']=0.0 by design). The shipped multiplier is 1 - 1.0*0.7 = 0.3: a 70% cut of
      the inhibited node's activation from one unweighted line of author YAML. inhib_gain HAS NEVER
      BEEN CALIBRATED FOR S=1.0. It is the most plausible mechanism for a six-query regression and it
      has its own dedicated knob - which is DELIBERATELY NOT TOUCHED here, because moving it on an
      unisolated six-query delta would be the identical methodological error at a different address.
      This is a SECOND INSTANCE of CF-5's failure mode: a constant calibrated against one implicit
      distribution, silently re-pointed at another.
    cost_of_reversal_recorded: >-
      declared_edge_strength = 0.0 AS A SHIPPED DEFAULT (as opposed to as an ablation switch) restores
      three of the four defects section 3.3.1 exists to fix. (1) Inhibition is a numeric no-op again,
      so AC-023 is unreachable in production again and AC-034 holds only because its test pins 1.0
      explicitly (tests/acceptance/test_declared_edge_weight.py:33). (2) AC-035's THEN becomes FALSE AS
      WRITTEN - raw weight = declared_edge_strength * type_gain['depends_on'] = 0.0, build_graph drops
      w<=0, the edge is ABSENT not present, and its proving unit's "assert raw_weight > 0"
      (tests/unit/core/test_edge_weight.py:88) reads cfg.declared_edge_strength and would FAIL at the
      shipped default - so shipping 0.0 is NOT a free config change: it needs an AC-035 restatement
      plus a tests/ change, both re-verification events. (3) Community structure loses declared edges
      outright, which is WORSE than pre-amendment because _COMMUNITY_WEIGHT_FLOOR=0.1 was deleted by
      this amendment - 0.0 is the prior state MINUS the floor, not a clean revert. Only plan_confidence
      survives, and only because section 3.3 step 10 was redefined STRUCTURALLY: core/composition.py
      _closure walks declared edges regardless of S_eff, and S_eff enters only as the cycle-break sort
      key, where the (S_eff, dep_name, dependent_name) total order stays deterministic even when every
      candidate ties at 0.0, so AC-042 holds either way. AC-039 REMAINS SATISFIABLE AT ANY SHIPPED
      DEFAULT: its proving unit sets cfg.declared_edge_strength = 0.0 explicitly
      (tests/unit/core/test_edge_weight.py:120), which is what makes every reversal condition a config
      line rather than a code change.
    negative_product_finding: >-
      RECORDED AT FULL STRENGTH, not softened. FORGE ruled H-BODY-b "falsified as implemented, UNTESTED
      AS DESIGNED" precisely because declared edges carried zero mass; that condition is now discharged.
      The result: at FULL authored mass, declared composes/depends_on in the activation graph changed
      ZERO of 210 top-1 answers in the isolated arm (c), and the full pipeline (d) was WORSE by six
      queries. The best (d) has ever measured - 0.5476, exactly tying dense baseline (b) - is measured
      with declared edges OFF. H-BODY-b therefore remains falsified as implemented and is now
      additionally NOT SUPPORTED AS DESIGNED on the only corpus that exists: zero supporting
      measurements, two non-supporting. What the amendment DID deliver, untouched by this run:
      plan_confidence is a real satisfiable ratio instead of a permanent client-visible 0.0
      (AC-037/AC-038); inhibition is reachable from register() rather than only from direct SQL
      (AC-034); cycle-breaking is deterministic instead of dict-iteration-ordered (AC-042); one
      weighting site instead of three divergent local workarounds (AC-040). None of those four is a
      retrieval-accuracy claim. The amendment fixed a correctness and coherence defect; it has NOT been
      shown to improve routing, and a release note must state those separately and the second without
      hedging.
    was_the_amendment_wrong: >-
      NO - and the falsifiable form of that answer is recorded rather than asserted. plan_confidence was
      unsatisfiable as the spec wrote it; AC-023 was unreachable by any production path; three divergent
      local workarounds patched the same zero. All three are defects independent of any benchmark, and
      the first is fixed independently of declared_edge_strength entirely. What IS now in doubt is
      NARROWER and named exactly: the claim that authored edges belong in the DIFFUSION GRAPH
      (call-site rows 1 and 3) has zero supporting measurements and one measured 0/210. If RC-3 also
      returns null, that specific claim should be RETIRED - mechanism kept, implemented and opt-in,
      declared_edge_strength = 0.0 shipped, AC-035 restated. That is RC-3's decision rule and it does
      NOT require RC-2 to reach significance.
    reversal_conditions_pre_registered:
      - "RC-1 (= MO-3, already owed): declared_edge_strength=1.0 with inhib_gain=0.7 vs inhib_gain=0.0, everything else fixed, same corpus and queries. RULE: if the inhibition arm accounts for the whole -0.0286 or more, the defect is the INHIBITION MAGNITUDE, not the authored channel - re-derive inhib_gain and leave declared_edge_strength at 1.0. If it accounts for none of it, the residual is the community re-clustering and call-site row 3 is what gets revisited. Also confirm (c) responds to the knob at all (see caveat_on_own_evidence)."
      - "RC-2: a SECOND, INDEPENDENTLY-AUTHORED registry (engrams and queries by different authors) plus a PAIRED McNEMAR test on (d) at 1.0 vs 0.0. RULE: if (d) at 1.0 is worse at p < 0.05 paired, declared_edge_strength ships at 0.0 - mechanism stays implemented, verified and opt-in - and AC-035 is restated to name a non-zero strength in its GIVEN. The addendum is not frozen; the frozen 33 are untouched either way."
      - "RC-3 (= CF-7): a COMPOSITIONAL query set - H-COMPOSE is still UNTESTED, zero compositional queries have ever been run, and Plan F1 as implemented cannot serve, being a monotone re-encoding of Hit@1. RULE: if declared mass does not improve a composition-sensitive metric there either, the diffusion channel has NO measured benefit on ANY metric and should ship off by default regardless of RC-1."
      - "RC-4: any registry whose declared relations are KNOWN-GOOD BY CONSTRUCTION. Removes the confound that this corpus's needs/composes/inhibits were authored by the same agent that wrote the queries, so a null here may be measuring poor input rather than the design."
      - "NOT SUFFICIENT, recorded so it is not mistaken for progress: re-running the SAME corpus with more queries. It shrinks the error bar on a measurement whose confound (single authorship of both the relations and the queries) is not statistical."
    corpus_limits_carried: >-
      The 210 queries are SINGLE-TARGET retrieval queries - three per engram, one gold answer each.
      Diffusion along a CORRECT needs/composes edge moves activation from the target toward its
      dependencies, which are by construction NOT the gold answer, so on this metric a correct
      composition edge can only be neutral or harmful. This is a real limit and it is DELIBERATELY NOT
      USED AS A SHIELD: it is converted into RC-3, with a decision rule attached. The single-authorship
      confound is RC-4.
    caveat_on_own_evidence: >-
      Stated against RAMZA's own key argument rather than buried: (c)'s invariance across the two arms
      could alternatively be a HARNESS ARTEFACT if the (c) arm did not pick up the config override.
      _baseline_c_rank reads cfg.declared_edge_strength from the same Config the router reads, so a
      single mutated Config would propagate to both - but if the arms were configured separately this
      is possible. Whoever runs RC-1 must confirm (c) responds to the knob at all before concluding
      anything from its invariance.
    options_rejected:
      - "LOWER TO AN INTERMEDIATE VALUE (0.3, 0.5): no point between the endpoints has been measured and both endpoints have. Interpolating toward the better endpoint without evidence re-introduces the second magnitude knob underneath type_gain that DECLARED-EDGES-AMENDED section 4.3 rejected on exactly these grounds, and damps the INERT channel and the SUSPECT channel together in unknown proportion - a fraction of an unmeasured benefit for a fraction of an unattributed harm."
      - "SHIP THE MECHANISM AT 0.0, OPT-IN: reverts three defects the amendment exists to fix, makes AC-035 false at the shipped default and thus forces a tests/ change, and is justified by a delta whose channel is not isolated and whose significance ceiling is p = 0.031. It also makes the DEFAULT configuration one in which no acceptance criterion exercises the mechanism."
      - "LOWER inhib_gain NOW: right suspect, wrong time - zero direct evidence, because the isolation was never run. It is RC-1."
      - "REVERT THE AMENDMENT ITSELF: rejected; see was_the_amendment_wrong."
    r12_disposition: "FIRED 2026-08-15 (mitigation executed as designed: the obligation forced the re-measurement BEFORE release rather than after, and produced a result its authors did not expect). STAYS OPEN at P1, NARROWED. Before: 'newly-live declared-edge mass' in general; ppr_restart possibly non-transferable; MO-1/MO-2/MO-3 all owed; exit condition 're-run and publish'. After: what is unmeasured is THE INHIBITION MAGNITUDE and THE COMMUNITY RE-CLUSTERING; the ppr_restart clause is CLOSED; MO-1 and MO-2 discharged, MO-3 still owed; the exit condition is four PRE-REGISTERED reversal conditions with decision rules attached. Owner unchanged: vivi+kupo."
