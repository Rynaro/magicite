  - id: INHIB-GAIN-RECALIBRATED
    at: "2026-08-15"
    record: .spectra/changes/magicite-v1-implementation/decisions/INHIB-GAIN-RECALIBRATED.md
    disposition: "ROUTING DEFAULT CHANGED on a DERIVED magnitude, after RC-1 discharged both halves. inhib_gain 0.7 -> 0.245 (= theta_synapse 0.35 * 0.7), PRECAUTIONARY PENDING RC-2. declared_edge_strength = 1.0 stands CONFIRMED by RC-1b. No rule change, no acceptance-criteria change, no code change implied, no re-plan, no re-scoring, no phase re-walk. R12-FIRED is NOT superseded - its declared_edge_strength ruling is CONFIRMED by this run."
    authorizing_trigger: "RC-1, the reversal condition pre-registered WITH ITS DECISION RULE by errata R12-FIRED (spec.md section 3.3.1), run by the orchestrator at commit 9963b89. No new external verdict was needed: this is the pre-registered rule being applied."
    trigger: >-
      RC-1b (the caveat R12-FIRED raised AGAINST ITS OWN key argument, with an instruction to check it
      first): (c) Hit@1 is 0.5286 at declared_edge_strength 0.0, 0.5286 at 1.0 and 0.5333 at the
      extreme 5.0 - so (c) DOES respond to the knob and its 0.0-vs-1.0 invariance is a REAL PROPERTY OF
      THE CORPUS, not a harness artefact. At 5.0 the two arms move in OPPOSITE directions ((c) up, (d)
      0.5048 down), consistent with the harm living in a channel (c) does not have. RC-1a at
      declared_edge_strength=1.0: inhib_gain=0.7 gives (d) 0.5190, inhib_gain=0.0 gives 0.5429 - 0.0239
      of the 0.0286 gap, 84%, residual one query (community re-clustering or noise, not separately
      resolvable on this corpus). Sweep (Hit@1 / Hit@3 / MRR): 0.0 = 0.5429/0.7429/0.6381; 0.1 =
      0.5333/0.7429/0.6348; 0.2 = 0.5333/0.7476/0.6335; 0.3 = 0.5286/0.7571/0.6358; 0.5 =
      0.5095/0.7524/0.6260; 0.7 (shipped) = 0.5190/0.7333/0.6227. Arithmetic correction to the RC-1
      report: with inhibition off, (d) 0.5429 trails (b) 0.5476 by ONE query at n=210 (114 vs 115), not
      two.
    ruling: >-
      THE QUESTION WAS CORRECTLY SPLIT by the orchestrator into "is 0.7 defensible" and "what replaces
      it", which carry different evidentiary standards; conflating them is what produces argmax-chasing.
      (1) 0.7 IS NOT DEFENSIBLE, on three grounds none of which is an argmax. (a) It is
      PARETO-DOMINATED BY FOUR OF THE FIVE ALTERNATIVES SWEPT: 0.7 = (109, 154, 0.6227) is worse than
      0.0, 0.1, 0.2 AND 0.3 on Hit@1, Hit@3 and MRR SIMULTANEOUSLY, and is the worst value in the sweep
      on both Hit@3 and MRR; only 0.5 fails to dominate it, and 0.5 is itself dominated by 0.3. This is
      METRIC-INDEPENDENT and ARGMAX-INDEPENDENT, and it is a WITHIN-SWEEP comparison - the design in
      which the single-author confound CANCELS ACROSS ARMS, the same property that made the ppr_restart
      sweep acceptable evidence. The confound attacks absolute levels and argmax selection; it does NOT
      attack dominance ordering. (b) It NEVER HAD ANY EVIDENCE FOR IT, IN ANY REGIME: until
      DECLARED-EDGES-AMENDED the inhibition pass was a NUMERIC NO-OP, so 0.7 was a plausible-looking
      constant IN A DEAD CODE PATH, never measured against anything, and its first exposure to
      measurement Pareto-dominates it away. "Do not change on weak evidence" protects incumbents that
      EARNED standing; it is not a licence to keep whatever is currently written down. (c) The
      mis-calibration is DIAGNOSABLE FROM THE DESIGN'S OWN CONSTANTS without any corpus: theta_synapse
      = 0.35 is the strength at which an edge becomes a GENUINE SYNAPSE (core/dream.py:503,515), so for
      a LEARNED inhibits edge the intended effect S*inhib_gain ranged over [0.245, 0.7] - "just became a
      synapse" to "maximally reinforced" - and section 3.3.1 pins S_eff=1.0 for EVERY authored inhibits
      edge on DAY ZERO, granting an assertion with no accumulated evidence the effect reserved for a
      maximally-potentiated synapse. (2) THE REPLACEMENT IS DERIVED, NOT SELECTED: inhib_gain =
      theta_synapse * inhib_gain_learned = 0.35 * 0.7 = 0.245, so an authored assertion enters at the
      BOTTOM of the intended range. Multiplier 1 - 1.0*0.245 = 0.755 (was 0.3). Deliberately NOT rounded
      to 0.25 - the un-round figure is the audit trail. If theta_synapse ever moves this is RE-DERIVED,
      not re-tuned. The magnitude comes from constants that PREDATE the amendment and did NOT come from
      this corpus; the corpus CORROBORATES rather than selects (0.245 falls between the swept 0.2 and
      0.3, both on the constrained Pareto frontier, and is the ARGMAX OF NOTHING). (3) inhib_gain=0.0 is
      FORBIDDEN, and it is the corpus's own Hit@1 ARGMAX: it makes AC-023 and AC-034 arithmetically
      UNPROVABLE - the identical argument that rejected w_activation=0 for a 0.0048 Hit@1 gain - and
      would ship an "inhibition" mechanism that does not inhibit. A NON-CORPUS CONSTRAINT thus excludes
      the corpus's own maximiser.
    consistency_with_r12_fired: >-
      Same TEST, opposite inputs, opposite answer - which is what consistency actually requires, rather
      than returning the same answer twice. R12-FIRED's test was: is the mechanism identified? does the
      value have prior standing? what does reversal forfeit? For declared_edge_strength: mechanism NOT
      identified (the isolated channel measured exactly inert), value DERIVED from an existing knob
      (S_eff * type_gain at 1.0 IS type_gain), reversal forfeits three shipped behaviours and makes
      AC-035 false -> KEEP. For inhib_gain: mechanism identified AND PRE-REGISTERED (named in R12-FIRED
      section 4.1 before RC-1 ran, then confirmed at 84%), value has NO standing in the regime it
      operates in, reversal forfeits nothing structural provided it stays > 0 -> CHANGE.
    what_this_does_not_rescue: >-
      EVEN WITH INHIBITION ENTIRELY OFF, (d) = 0.5429 IS STILL BELOW (b) = 0.5476 by one query. Turning
      inhibition down makes the full pipeline STOP LOSING BY MUCH; it does not make it win. H-BODY-b IS
      NOT RESCUED and R12-FIRED's negative finding stands UNALTERED: at full authored mass the diffusion
      channel changed ZERO of 210 top-1 answers, and the claim that authored graph structure improves
      routing still has ZERO supporting measurements. This record repairs a constant that was actively
      degrading the pipeline; that is a defect repair, not evidence for the thesis.
    rc_5_new: >-
      THE Hit@1/Hit@3 DIVERGENCE, pre-registered rather than resolved. Hit@1 falls roughly monotonically
      with inhibition while Hit@3 PEAKS AT 0.3 (0.7571), ABOVE dense embedding's 0.7429 - the FIRST
      measurement in this project of the graph layer beating the embedding baseline at anything.
      Mechanistically coherent (suppressing a competitor improves the candidate SET while risking the
      TOP-1 pick where the gold answer is what got suppressed), but six numbers from one corpus, and
      Hit@1 is NOT monotone across it (0.5 gives 107 while 0.7 gives 109) - a noise signature that
      should temper any reading of fine structure. DECISION RULE, metric named in advance so it cannot
      be chosen after the fact: HIT@1 IS THE METRIC OF RECORD (it is what the Hypothesis Register uses
      and what H-BODY was adjudicated on), so a HIT@3-ONLY improvement does NOT justify raising
      inhib_gain. If RC-2 reproduces the Hit@3 peak AND Hit@1 is flat across that region, the question
      stops being a knob and becomes a PRODUCT DECISION - top-1 pick or candidate set? - and goes to the
      HUMAN, not to RAMZA.
    what_rc2_rc3_must_now_answer: >-
      RC-1's outcome CHANGES THE JOB of the remaining conditions. RC-2 must now test THREE things: (i)
      (d) at declared_edge_strength 1.0 vs 0.0, paired; (ii) the DERIVED inhib_gain=0.245 against its
      swept neighbourhood - and if it loses at p<0.05 paired on Hit@1, the DERIVATION is wrong and the
      value is RE-DERIVED, NOT replaced by that corpus's argmax either; (iii) whether RC-5's divergence
      reproduces. RC-3 is RAISED IN PRIORITY: inhibition's claimed benefit is suppressing
      mutually-exclusive competitors, which should register in CANDIDATE-SET quality, and RC-5's Hit@3
      peak is the first sign of it - RC-3 is now the most likely place for the design's claim to be
      SUPPORTED rather than merely not-falsified. RC-4 unchanged. INDEPENDENCE REQUIREMENT restated:
      RC-2's second corpus must be independent in the AUTHORSHIP OF THE DECLARED RELATIONS, not merely
      of the queries.
    options_rejected:
      - "SHIP 0.7 UNCHANGED AND LET RC-2 SETTLE IT: considered seriously - the orchestrator explicitly offered it and was not fishing. Rejected per consistency_with_r12_fired: keeping 0.7 would mean defending a number Pareto-dominated by four of five alternatives, never measured in any regime, and now known mis-calibrated by a mechanism named in advance."
      - "0.3 (the Hit@3 argmax): the overfitting the orchestrator flagged, and he is right - six numbers from one corpus whose relations and queries share an author. That 0.245 lands near 0.3 is CORROBORATION, not the reason for it; had the derivation pointed at 0.5 this record would have said 0.5."
      - "0.0 (the Hit@1 argmax): FORBIDDEN - it makes AC-023 and AC-034 unprovable."
      - "0.25 (a rounded 0.245): cosmetic rounding would obscure the one thing that makes the value defensible - that it was computed, not chosen."
      - "RE-DERIVE theta_synapse TOO: out of scope and unmeasured; it governs Dream's synapses: membership, not routing."
    acceptance_criteria_impact: "NO criterion added, edited or removed. AC-023 (frozen) HOLDS at 0.245 - multiplier 0.755 < 1 strictly; its fixture injects storage_strength=0.8 by direct SQL and S_eff = max(0.8, 1.0) = 1.0, unchanged. AC-034 HOLDS - strictly lower than the declared_edge_strength=0.0 run, by a smaller but non-zero margin. AC-039 UNAFFECTED - at declared_edge_strength=0.0 the multiplier is 1 for any gain. AC-035/036/037/038/040/041/042 UNAFFECTED. VERIFICATION OBLIGATION VO-1: AC-023 and AC-034 MUST BE RE-ATTESTED at 0.245; both are satisfiable by construction, but if either holds only BY A HAIR rather than robustly, that is evidence the magnitude is too low and MUST BE REPORTED, NOT ABSORBED."
    spec_md_sha256: {prev: 757313fc568c2b2332d67e255f25b493b7f03c16583fb6a8e1693b4e29200440, new: 6d3bff8e6a4507b4afc758d843c85075e7cd3e5da1b14117909c13579138c4fe}
    spec_md_locations: "eight located patches: the errata banner; section 3.3 route STEP 5 pseudocode (inhib_gain=0.7 -> 0.245, superseded value struck in-comment); the routing-defaults table (new inhib_gain row); section 3.3.1 ground 2's closing sentence; the RC table (RC-1 DISCHARGED, RC-2/RC-3 sharpened, RC-5 ADDED); the NEW normative section 3.3.2 'Inhibition magnitude'; the section Risks R12 row; the Handoff bullet."
    envelope_integrity_restamped: true
    behaviour_change: "YES, via ONE CONFIG LINE: magicite.toml inhib_gain = 0.7 -> 0.245. No code change is implied (inhib_gain is already read from config at core/router.py:342-345). No criterion text changes. VO-1 applies."
    config_change_implied: "magicite.toml [routing] inhib_gain 0.7 -> 0.245. Vivi's to apply; magicite.toml is outside RAMZA's write boundary."
    unchanged: "declared_edge_strength = 1.0 - CONFIRMED by RC-1b, not merely retained; R12-FIRED is NOT superseded. S_eff = max(storage_strength, w_authored), w_authored, all seven call sites, the withheld hub-penalty PageRank, the read-time/never-stored property. theta_synapse = 0.35 - the SOURCE of the derivation, not a subject of it. ppr_restart = 0.85, w_activation, w_similarity, w_retrieval, type_gain, hub_penalty, w_max and every plasticity constant. acceptance_criteria.sha256 (7bd3d184..., byte-identical, NOT re-frozen, amendments[] still empty, criteria_sha256 untouched, AC-023 not edited) and acceptance-criteria-addendum.md (28888863..., byte-identical). The 16-tool surface, INV-1...INV-4, the P0 guards, the Tier A/B/C split, all nine validation_gates, milestones, corpus_contradictions; every ramza.scores value, the critic record and the phase walk - not re-run and not re-scored; src/, tests/, docs/, change.json."
    carry_forward: "CF-1...CF-7 all carried unchanged from R12-FIRED. CF-5 gains a CONFIRMED second instance: this record IS the repair of an uncalibrated combination-rule constant (inhib_gain set against one implicit distribution and silently re-pointed at another), and the repair METHOD - derive from an existing constant rather than tune - is the pattern CF-5's eventual fix should generalise. CF-3 gains a rider: if the earnable-declared-edge path is ever built, a POTENTIATED inhibits edge would exceed the authored floor while inhib_gain remains a single GLOBAL gain, so the authored/learned split would need revisiting then."
    maker_checker_disclosure: "RAMZA is changing a constant on evidence RAMZA asked for, having named the mechanism in advance. A prediction confirmed is stronger than a claim asserted - AND IT IS ALSO THE SHAPE A MOTIVATED REASONER PRODUCES. So the scepticism is handed forward explicitly: THE DERIVATION IS THE PART TO ATTACK. inhib_gain_authored = theta_synapse * inhib_gain_learned treats the PRODUCT S*inhib_gain as the calibrated quantity and reads theta_synapse as the entry point of the intended range; that is defensible but it is a RECONSTRUCTION OF INTENT, not a documented derivation, because the original 0.7 came with no recorded rationale at all. If a reader rejects the reconstruction, what survives UNAFFECTED is the dominance argument (0.7 is Pareto-dominated by four of five swept alternatives and never had evidence in any regime). The derivation only answers 'then what instead?', and its wrongness is caught by RC-2's rule, which RE-DERIVES rather than re-tunes."
    verified_status_impact: "This errata DOES change executable behaviour, via one config line. The change remains in_progress. AC-023 and AC-034 must be re-attested at 0.245 (VO-1) and the routing-sensitive validation gates re-run; no criterion text changes, so the frozen 33 and the addendum's 9 are attested as written. What a re-verifier should check independently is the hash chain, which moved by design: spec.md 757313fc... -> 6d3bff8e..., mirrored in artifacts[], spec.envelope.json (artifact.sha256 / integrity.value / x_ramza_amendment[4]) and plan-state.json errata[4]."
    human_confirmation: "RECOMMENDED BEFORE RELEASE. (1) inhib_gain 0.7 -> 0.245 is DERIVED from theta_synapse, not measured - corroborated by the sweep but not selected by it, and the derivation is a reconstruction of intent a human may want to sanity-check (see maker_checker_disclosure). (2) The product claim is UNCHANGED: even with inhibition off the full pipeline still trails dense embedding by one query, so H-BODY-b is not rescued and any release note must still say the routing claim has zero supporting measurements. (3) RC-5 flags that Hit@3 peaks ABOVE the embedding baseline at inhib_gain=0.3 - the first sign of the graph layer beating embeddings at anything - and if it reproduces on a second corpus, whether the product is the top-1 pick or the candidate set is a HUMAN decision, not RAMZA's. (4) w_retrieval 0.15 -> 0.05 remains precautionary pending D1/D2. None blocks implementation."

