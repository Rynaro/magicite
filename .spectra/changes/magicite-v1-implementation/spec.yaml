# ── stack decisions (fixed upstream; A1 reopened once — see errata A1-REVISED) ─
stack:
  language: python
  python_requires: ">=3.11"
  framework: mcp.server.lowlevel.Server (official MCP Python SDK, mcp>=2.0,<3.0)
  framework_assumption: >-
    A1-REVISED — resolved on execution-verified evidence 2026-08-14; blast radius confirmed at
    src/magicite/mcp/app.py (+ pyproject.toml, uv.lock, tests), inside A1's own declared bound.
    Handlers register via the public constructor kwargs on_list_tools=/on_call_tool=; the FastMCP
    private-attribute reach-through and validate_input=False are gone. Supersedes A1 (was:
    mcp.server.fastmcp.FastMCP on mcp>=1.12; standalone fastmcp>=2 would change only
    src/magicite/mcp/*). Record: decisions/A1-REVISED.md; verdict: FORGE 2026-08-14; commit 2d12134.
  transport: stdio
  storage: sqlite (WAL, embedded, single file)
  embeddings:
    default_provider: fastembed (ONNX BAAI/bge-small-en-v1.5, baked into the image)
    alt_providers: [ollama, hashing]
    banned: torch
  distribution:
    primary: "ghcr.io/rynaro/magicite (sibling-MCP pattern: --cap-drop ALL, no-new-privileges, non-root UID 10001, digest-pinned)"
    secondary: pip install magicite (development)
  out_of_scope: [served HTTP/OAuth/Postgres profile, CRDT merge, GNN layer, fine-grained telemetry KPI, in-server generative model, R4/R5 tools]

# ── architecture invariants (the four commitments in spec Approach) ────────
invariants:
  - id: INV-1
    statement: the engine is a library; MCP is an adapter (magicite.core never imports the MCP framework)
  - id: INV-2
    statement: writers are a place, not a rule — durable mutation only inside the leased WriterExecutor
  - id: INV-3
    statement: files are the source of truth (Tier A+B in .egr.md); the graph DB is a rebuildable index
  - id: INV-4
    statement: the 16-tool surface is frozen at M0; unimplemented bodies return typed not_implemented
p0_enforcement:
  g1_authorizer: sqlite3 set_authorizer DENYs INSERT/UPDATE/DELETE on any non-eph_ table for hot-path connections (mechanism verified executable)
  g2_lease: storage/durable.py asserts WriterLease ownership on every public write
  g3_dream_context: writer.write_plasticity/write_synapses assert the Dream ContextVar set only by dream.checkpoint_phase()
  tier_gate: plasticity.apply() raises P0Violation for any Tier-0 signal targeting S

