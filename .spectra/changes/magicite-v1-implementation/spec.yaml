# ── corpus contradictions resolved unilaterally (spec section 9) ───────────
corpus_contradictions:
  - id: CR-1
    confidence: high
    tension: "route() updates exposure_count (docs/05) vs Tier-A file fields being Dream-only (docs/02-04)"
    resolution: "bookkeeping counters are Tier-C accumulators (eph_bookkeeping); the file value is last-checkpoint + delta, folded in at Dream phase 7"
  - id: CR-2
    confidence: high
    tension: "skill-graph.db 'can be committed' (docs/06) vs the DB being a rebuildable cache (docs/03,04)"
    resolution: "path stays per docs/02; register() writes a .gitignore excluding skill-graph.db*; MAGICITE_COMMIT_DB=1 restores the docs/06 reading"
  - id: CR-3
    confidence: high
    tension: "Dream drafts composites 'via local model' (docs/03) and the LLM rubric (docs/07) vs local-first no-service posture (docs/02)"
    resolution: "the v1 server ships no generative model: nucleate emits proposals (trace IR + skeleton), the host agent drafts and calls register(); the rubric gate is a deterministic 12-point structural rubric at the docs/07 >=8/12 bar; rubric_provider=host reserved"
  - id: CR-4
    confidence: high
    tension: "register()'s 'any lint violation -> hard error' vs GAP-005 wholesale SKILL.md migration"
    resolution: "two lint profiles: strict keeps the hard error; import downgrades to warnings and lands status=draft + verification_status=pending, never routable, never silently accepted"
  - id: CR-5
    confidence: high
    tension: "the 16-tool surface (brief, docs/05's 8+8 arithmetic) vs 13 tools actually headed in docs/05"
    resolution: "v1 ships exactly 16 = 14 unified inventory + load_skill_body (docs/05 progressive disclosure) + session_end (docs/03 session-end trace, the on-session-end Dream trigger); 8+8 is pre-deduplication"
  - id: CR-6
    confidence: high
    tension: "Ollama named in docs/02 vs 'local embedding model' plus an offline hardened container"
    resolution: "Embedder protocol with fastembed (default, baked), ollama (opt-in, preserves the docs/02 reading), hashing (deterministic, CI); embedding.model records the producer so docs/04's bge-m3 example stays legal"
  - id: CR-7
    confidence: high
    tension: "docs/06 says imports start status=pending vs docs/04's status=nascent + verification_status=pending"
    resolution: "the two axes stay orthogonal; pending is never a lifecycle status; imports are status in {nascent, draft} x verification_status=pending"
  - id: CR-8
    confidence: high
    tension: "docs/04 defines id as the content-hash of identity+routing while version bumps on every sharpening \u2014 sharpening would change every id and dangle every edge FK"
    resolution: "id is computed once at first registration and is thereafter immutable; the identity+routing hash lives separately as identity_sha256 for drift and duplicate-import detection (found by the critic pass)"

