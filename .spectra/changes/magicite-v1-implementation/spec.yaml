# ── risk register ──────────────────────────────────────────────────────────
risks:
  - id: R1
    tag: P0
    owner: vivi
    milestone: "M3,M4"
    risk: "Signal poisoning / adversarial valence — docs/07's 'bounded, not eliminated'. The risk framing was always right; its mitigation bookkeeping was not (see revised_by)."
    mitigation: >-
      Object-keyed and temporal, not identity-keyed. Under local-first stdio no per-subject quota can
      bind (one OS principal shared by client and server; session_id is caller-supplied, unauthenticated
      and free to mint), so every bound below is keyed on an engram and on elapsed wall clock — what a
      caller cannot mint. Two-phase commit (tags != weights); Tier-0 barred from S; Dream-only S writes
      (G3); eph_tag is the sole plasticity-S input and eph_event never is, now held by a test rather than
      a docstring (100 planted Tier-2 valence=+1.0 rows move S by exactly 0.0); a per-engram refractory
      window on the R bump (eta_r_refractory_s=30s) so R counts occasions, not calls; decay applied at
      read (lambda_R 0.1/day, lambda_S 0.01/day) so influence self-reverses with no Dream run, no sync()
      and no human; spacing-gated potentiation (tau_spacing_hours=6.0) so a burst establishes anchors and
      commits nothing (200 captured Tier-1 tags -> delta S = 0.000000000; the first commit needs >= ~85
      min of elapsed time, then at most one commit per engram per Dream run, ceiling +0.048 per
      occasion); bounded retroactive credit (retroactive_credit_max=10); metaplastic saturation (bounds
      the per-event step, never the number of events); Tier-1 weighted 0.6. per_skill_session_cap=3 is
      RETAINED as runaway protection and is NOT counted as an anti-poisoning control — an executed
      adversarial review drove 253 tags / 200 captures for a single skill against it, on the honest path.
      Residuals, verified post-fix and still open: cap-burning inside another agent's session, and a
      cross-session high-salience -1.0 retroactive-credit hijack; closing either needs caller identity
      (structurally impossible under stdio) or a change to the frozen 16-tool surface. The originally
      cited 'adversarial-noise robustness test in the ablation suite' never shipped (carry-forward CF-1);
      the standing evidence is two executed adversarial reviews plus an 8-guard mutation spot-check.
      Full record, evidence and residual list: decisions/R1-RESTATED.md.
    revised_by: >-
      R1-RESTATED (2026-08-15): the mitigation previously read 'two-phase commit, Tier-0 barred from S,
      Tier-1 capped 3 dw/skill/session at weight 0.6, metaplastic saturation, Dream-only S writes'. The
      capped clause described a control that cannot bind: the cap is keyed on (session_id, engram_id),
      session_id is caller-supplied and unauthenticated, and omitting it mints a fresh session per call,
      so the documented calling convention defeats it with no malice (253 tags / 200 captures, executed).
      Authorizing verdict: FORGE (Reasoner) — Magicite Signal Integrity and Identity Model, 2026-08-14,
      gate PASS, confidence 86%, section 5.2 routing the spec edit to RAMZA. Risk statement substance,
      tag (P0), owner and milestone are unchanged; no AC, VG command, invariant, tool signature,
      milestone or section-9 resolution was touched; nothing was re-scored.
  - id: R2
    tag: P0
    owner: vivi
    milestone: "M3"
    risk: "Tier-2 provenance spoofing"
    mitigation: "tier assigned server-side; Tier 2 requires adapter_token == MAGICITE_HOOK_TOKEN (AC-015)"
  - id: R3
    tag: P1
    owner: vivi
    milestone: "M4"
    risk: "Checkpoint file churn above the 5% target"
    mitigation: "epsilon-hysteresis 0.05, lazy S materialisation, state-derived dirty set, checkpoint_write_ratio CI assertion"
  - id: R4
    tag: P1
    owner: vivi
    milestone: "M2,M7"
    risk: "Embedding provider weight / offline behaviour"
    mitigation: "model baked at build, MAGICITE_EMBEDDING_OFFLINE=1, hashing provider for CI, torch banned (AC-031)"
  - id: R5
    tag: P1
    owner: vivi
    milestone: "M2"
    risk: "Leiden dependency fragility (igraph/leidenalg wheels)"
    mitigation: "CommunityDetector protocol; Leiden as an extra; label-propagation fallback reported by introspect (AC-022)"
  - id: R6
    tag: P2
    owner: vivi
    milestone: "M0"
    risk: "MCP SDK tool-metadata API drift"
    mitigation: >-
      metadata owned by TOOL_REGISTRY; MCP annotations/_meta are projections; magicite tools prints
      the authoritative manifest (AC-004). Handler registration is now a public constructor API
      (Server(name, on_list_tools=..., on_call_tool=...)) and _meta is a first-class mcp.types.Tool
      kwarg, so the residual collapses to ordinary type-import drift.
    revised_by: "A1-REVISED (2026-08-14): retitled from 'FastMCP metadata API drift' and downgraded P1 -> P2 — the original subject, the private-attribute reach-through app._mcp_server.list_tools()(...) / .call_tool(validate_input=False)(...), no longer exists in the tree"
  - id: R7
    tag: P2
    owner: vivi
    milestone: "M4,M7"
    risk: "Lock semantics on non-local filesystems"
    mitigation: "flock plus DB writer_lease with TTL/heartbeat; magicite doctor warns; documented in docs/operations.md"
  - id: R8
    tag: P2
    owner: vivi
    milestone: "M6"
    risk: "Distillation quality without an in-server LLM (CR-3)"
    mitigation: "support/consistency thresholds, approval-gated proposals landing nascent+pending; revisit if acceptance < 30%"
  - id: R9
    tag: P2
    owner: vivi
    milestone: "M2"
    risk: "Cold start / small registries (<50 skills Magicite is overhead)"
    mitigation: "route() returns registry_size; magicite doctor states break-even honestly"
  - id: R10
    tag: P1
    owner: kupo+vivi
    milestone: "M6"
    risk: "Hypothesis falsification (H-BODY/H-SCALE/H-COMPOSE/H-LEARN are UNVERIFIED-2026). FIRED 2026-08-15 on 70 engrams / 210 pre-registered queries: H-BODY-a supported in DIRECTION (+14.3pp Hit@1, p=0.00064) but the registered >=20pp effect size is NOT demonstrated; H-BODY-b FALSIFIED as implemented ((b) > (d), -0.0857, p=0.00053); H-SCALE mechanism FALSIFIED at 70 skills with 5 real communities; H-SCALE claim INCONCLUSIVE; H-COMPOSE UNTESTED (zero compositional queries were run and Plan F1 as implemented is a monotone re-encoding of Hit@1); H-LEARN FALSIFIED as implemented under uniform demand. The mitigation worked as designed - cheap and early."
    mitigation: "bench harness with baselines a-d ships in v1 so falsification is early and cheap. A measured falsification is the mitigation SUCCEEDING: what it now requires is that the product claim be reframed to what the evidence licenses - a semantic skill router with a portable format, a lifecycle, governance, composition-plan expansion and an instrumented learning substrate that is NOT yet demonstrated to improve routing. Two routing defaults moved on that evidence (errata DECLARED-EDGES-AMENDED); the docs/01 + docs/07 corrections are routed to IDG as CF-1."
    fired: true
    fired_at: "2026-08-15"
  - id: R11
    tag: P1
    owner: kupo
    milestone: "verify"
    risk: "Critic independence \u2014 the critic pass ran in-session (no second agent available)"
    mitigation: "disclosed, not laundered; Kupo is the independent checker at ESL verify; frozen criteria hash is the tamper anchor"
  - id: R12
    tag: P1
    owner: vivi+kupo
    milestone: "M2,M6"
    added_by: DECLARED-EDGES-AMENDED
    risk: "Newly-live declared-edge mass is itself unmeasured. Section 3.3.1 puts declared composes/depends_on into the activation graph and makes inhibition arithmetically real for the first time - 11 declared inhibits relations in the 70-engram benchmark registry that have NEVER had any effect now scale their targets' activation by 0.3. ppr_restart=0.85 was measured on the OLD graph, so its 0.5476 Hit@1 does not transfer unchanged; community structure re-clusters once _COMMUNITY_WEIGHT_FLOOR is deleted; and baseline (c)'s published numbers move. Shipping on an obsolete measurement is exactly the failure this amendment exists to correct."
    mitigation: "One config scalar and exactly revertible: declared_edge_strength=0.0 reproduces pre-amendment scores bit-for-bit (AC-039), so it is bisectable and can be backed out with no code change. Release obligation (section 3.3.1): re-run the cold 210-query bench after implementation and PUBLISH the new (b)/(c)/(d) numbers, reporting the inhibition delta separately so the edge-weight change and the ppr_restart change are not conflated. Direction of travel is toward LESS diffusion overall - section 3.3.1 puts authored structure in while ppr_restart=0.85 damps how far anything travels, which is deliberate."

# ── corpus contradictions resolved unilaterally (spec section 9) ───────────
corpus_contradictions:
  - id: CR-1
    confidence: high
    tension: "route() updates exposure_count (docs/05) vs Tier-A file fields being Dream-only (docs/02-04)"
    resolution: "bookkeeping counters are Tier-C accumulators (eph_bookkeeping); the file value is last-checkpoint + delta, folded in at Dream phase 7"
  - id: CR-2
    confidence: high
    tension: "skill-graph.db 'can be committed' (docs/06) vs the DB being a rebuildable cache (docs/03,04)"
    resolution: "path stays per docs/02; register() writes a .gitignore excluding skill-graph.db*; MAGICITE_COMMIT_DB=1 restores the docs/06 reading"
  - id: CR-3
    confidence: high
    tension: "Dream drafts composites 'via local model' (docs/03) and the LLM rubric (docs/07) vs local-first no-service posture (docs/02)"
    resolution: "the v1 server ships no generative model: nucleate emits proposals (trace IR + skeleton), the host agent drafts and calls register(); the rubric gate is a deterministic 12-point structural rubric at the docs/07 >=8/12 bar; rubric_provider=host reserved"
  - id: CR-4
    confidence: high
    tension: "register()'s 'any lint violation -> hard error' vs GAP-005 wholesale SKILL.md migration"
    resolution: "two lint profiles: strict keeps the hard error; import downgrades to warnings and lands status=draft + verification_status=pending, never routable, never silently accepted"
  - id: CR-5
    confidence: high
    tension: "the 16-tool surface (brief, docs/05's 8+8 arithmetic) vs 13 tools actually headed in docs/05"
    resolution: "v1 ships exactly 16 = 14 unified inventory + load_skill_body (docs/05 progressive disclosure) + session_end (docs/03 session-end trace, the on-session-end Dream trigger); 8+8 is pre-deduplication"
  - id: CR-6
    confidence: high
    tension: "Ollama named in docs/02 vs 'local embedding model' plus an offline hardened container"
    resolution: "Embedder protocol with fastembed (default, baked), ollama (opt-in, preserves the docs/02 reading), hashing (deterministic, CI); embedding.model records the producer so docs/04's bge-m3 example stays legal"
  - id: CR-7
    confidence: high
    tension: "docs/06 says imports start status=pending vs docs/04's status=nascent + verification_status=pending"
    resolution: "the two axes stay orthogonal; pending is never a lifecycle status; imports are status in {nascent, draft} x verification_status=pending"
  - id: CR-8
    confidence: high
    tension: "docs/04 defines id as the content-hash of identity+routing while version bumps on every sharpening \u2014 sharpening would change every id and dangle every edge FK"
    resolution: "id is computed once at first registration and is thereafter immutable; the identity+routing hash lives separately as identity_sha256 for drift and duplicate-import detection (found by the critic pass)"

