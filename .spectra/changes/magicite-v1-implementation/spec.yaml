# ── risk register ──────────────────────────────────────────────────────────
risks:
  - id: R1
    tag: P0
    owner: vivi
    milestone: "M3,M4"
    risk: "Signal poisoning / adversarial valence — docs/07's 'bounded, not eliminated'. The risk framing was always right; its mitigation bookkeeping was not (see revised_by)."
    mitigation: >-
      Object-keyed and temporal, not identity-keyed. Under local-first stdio no per-subject quota can
      bind (one OS principal shared by client and server; session_id is caller-supplied, unauthenticated
      and free to mint), so every bound below is keyed on an engram and on elapsed wall clock — what a
      caller cannot mint. Two-phase commit (tags != weights); Tier-0 barred from S; Dream-only S writes
      (G3); eph_tag is the sole plasticity-S input and eph_event never is, now held by a test rather than
      a docstring (100 planted Tier-2 valence=+1.0 rows move S by exactly 0.0); a per-engram refractory
      window on the R bump (eta_r_refractory_s=30s) so R counts occasions, not calls; decay applied at
      read (lambda_R 0.1/day, lambda_S 0.01/day) so influence self-reverses with no Dream run, no sync()
      and no human; spacing-gated potentiation (tau_spacing_hours=6.0) so a burst establishes anchors and
      commits nothing (200 captured Tier-1 tags -> delta S = 0.000000000; the first commit needs >= ~85
      min of elapsed time, then at most one commit per engram per Dream run, ceiling +0.048 per
      occasion); bounded retroactive credit (retroactive_credit_max=10); metaplastic saturation (bounds
      the per-event step, never the number of events); Tier-1 weighted 0.6. per_skill_session_cap=3 is
      RETAINED as runaway protection and is NOT counted as an anti-poisoning control — an executed
      adversarial review drove 253 tags / 200 captures for a single skill against it, on the honest path.
      Residuals, verified post-fix and still open: cap-burning inside another agent's session, and a
      cross-session high-salience -1.0 retroactive-credit hijack; closing either needs caller identity
      (structurally impossible under stdio) or a change to the frozen 16-tool surface. The originally
      cited 'adversarial-noise robustness test in the ablation suite' never shipped (carry-forward CF-1);
      the standing evidence is two executed adversarial reviews plus an 8-guard mutation spot-check.
      Full record, evidence and residual list: decisions/R1-RESTATED.md.
    revised_by: >-
      R1-RESTATED (2026-08-15): the mitigation previously read 'two-phase commit, Tier-0 barred from S,
      Tier-1 capped 3 dw/skill/session at weight 0.6, metaplastic saturation, Dream-only S writes'. The
      capped clause described a control that cannot bind: the cap is keyed on (session_id, engram_id),
      session_id is caller-supplied and unauthenticated, and omitting it mints a fresh session per call,
      so the documented calling convention defeats it with no malice (253 tags / 200 captures, executed).
      Authorizing verdict: FORGE (Reasoner) — Magicite Signal Integrity and Identity Model, 2026-08-14,
      gate PASS, confidence 86%, section 5.2 routing the spec edit to RAMZA. Risk statement substance,
      tag (P0), owner and milestone are unchanged; no AC, VG command, invariant, tool signature,
      milestone or section-9 resolution was touched; nothing was re-scored.
  - id: R2
    tag: P0
    owner: vivi
    milestone: "M3"
    risk: "Tier-2 provenance spoofing"
    mitigation: "tier assigned server-side; Tier 2 requires adapter_token == MAGICITE_HOOK_TOKEN (AC-015)"
  - id: R3
    tag: P1
    owner: vivi
    milestone: "M4"
    risk: "Checkpoint file churn above the 5% target"
    mitigation: "epsilon-hysteresis 0.05, lazy S materialisation, state-derived dirty set, checkpoint_write_ratio CI assertion"
  - id: R4
